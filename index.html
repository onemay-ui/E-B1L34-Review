<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DFF3FF">
<title>B1 L3+L4 單字句子大冒險</title>
<style>
:root{
  --ink:#2B2B3A; --sub:#6B6F85; --bg:#DFF3FF; --card:#fff;
  --yellow:#FFD23F; --pink:#FF8FB1; --mint:#7BE0B0; --blue:#6FA8FF; --purple:#A58BFF; --red:#FF6B6B; --green:#2DBE7E;
  --en:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--zh);font-size:17px;line-height:1.45;
  background-color:var(--bg);background-image:radial-gradient(#fff 2.2px,transparent 2.2px);background-size:26px 26px}
[lang="en"]{font-family:var(--en)}
[lang="zh-Hant"]{font-family:var(--zh)}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 5px 0 var(--ink)}
.btn{min-height:56px;border-radius:18px;border:3px solid var(--ink);background:var(--yellow);font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--ink);padding:0 18px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.sec{background:#fff}
.btn.go{background:var(--green);color:#fff}
.btn.pulse{animation:pulse 1.2s infinite}
.btn[disabled]{opacity:.5}
.link{background:none;min-height:44px;color:var(--sub);font-size:15px;text-decoration:underline}

/* mascot */
.mas{width:64px;height:64px;flex:none}
.mas svg{width:100%;height:100%;overflow:visible}
.mas.idle{animation:bob 2.4s ease-in-out infinite}
.mas.happy{animation:bounce .6s}
.mas.oops{animation:wobble .6s}

/* REG */
#reg{justify-content:center;gap:12px;overflow-y:auto}
#reg>*{flex-shrink:0}
#reg h1{margin:0;text-align:center;font-size:clamp(24px,7vw,30px);line-height:1.2}
#reg .mas{width:96px;height:96px;margin:0 auto}
.field{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:15px}
.field input{width:100%;min-width:0;min-height:52px;border:3px solid var(--ink);border-radius:16px;padding:0 14px;font-size:18px;background:#fff;font-weight:700}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px #BBD6FF}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px}
#regerr{color:#D7263D;font-weight:800;min-height:24px;text-align:center;font-size:15px}

/* HOME */
#home{gap:10px;overflow-y:auto;overflow-x:hidden;padding:2px 6px}
.hhead{display:flex;align-items:center;gap:10px}
.hhead .hi{flex:1;min-width:0}
.hhead .hi b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhead .hi small{color:var(--sub);font-size:15px}
.badge{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 var(--ink);min-height:44px;display:flex;align-items:center}
.guess{font-size:15px;font-weight:800;text-align:center}
.chips{display:flex;gap:8px;justify-content:center;margin-top:6px}
.chip{min-height:44px;min-width:60px;padding:0 12px;border-radius:22px;background:#fff;border:3px solid var(--ink);font-weight:900}
.chip.on{background:var(--ink);color:#fff}
.lv{display:flex;align-items:center;gap:12px;text-align:left;min-height:84px;border-radius:22px;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 14px;width:100%;transition:transform .08s,box-shadow .08s}
.lv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lv .e{font-size:36px}
.lv .t{flex:1;min-width:0}
.lv .t b{display:block;font-size:20px}
.lv .t small{font-size:15px;color:#454860}
.lv .s{font-size:18px;letter-spacing:1px;white-space:nowrap}
.hbot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hbot .btn{font-size:17px;min-height:52px}
.tgl{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.tgl button{min-height:44px;border-radius:14px;background:#fff;border:3px solid var(--ink);padding:0 12px;font-weight:800;font-size:15px}
.tgl button.off{opacity:.45}

/* GAME */
#hud{display:flex;align-items:center;gap:8px}
#quit{min-width:44px;min-height:44px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-weight:900}
#quit.arm{background:var(--red);color:#fff}
#lvname{flex:1;font-weight:900;font-size:16px;padding:6px 10px;border-radius:14px;border:3px solid var(--ink);background:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-weight:900;font-size:16px;padding:6px 10px;border-radius:14px;border:3px solid var(--ink);background:#fff;white-space:nowrap;min-height:44px;display:flex;align-items:center}
#pips{display:flex;gap:5px;margin:8px 0 2px}
#pips i{flex:1;height:12px;border-radius:6px;background:#fff;border:2.5px solid var(--ink)}
#pips i.cur{background:var(--yellow);animation:pulse 1s infinite}
#pips i.ok{background:var(--green)}
#pips i.bad{background:#FFB07A}
#mrow{display:flex;align-items:center;gap:8px;min-height:68px}
#bubble{flex:1;min-height:52px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 12px;font-weight:800;font-size:16px;display:flex;align-items:center;position:relative;opacity:0;transform:scale(.9);transition:all .2s}
#bubble.on{opacity:1;transform:scale(1)}
#bubble:before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:9px solid var(--ink);border-left:0}
#bubble b{margin-right:6px}
#stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;position:relative;padding:4px 2px 8px}
.tag{font-size:15px;font-weight:900;color:#3F6FE0}
.sent{font-size:clamp(20px,5.8vw,25px);line-height:1.55;font-weight:700;margin-top:6px}
.blank{display:inline-block;margin:0 .18em;min-width:3.2em;border-bottom:4px solid var(--pink);text-align:center;font-weight:900;color:#D6336C}
.blank.fill{color:var(--green);border-color:var(--green);animation:pop .35s}
.zh{margin-top:8px;font-size:16px;color:var(--sub);min-height:24px}
.zh b{color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{min-height:58px;border-radius:18px;background:#fff;border:3px solid var(--ink);font-size:clamp(19px,5.4vw,23px);font-weight:800;font-family:var(--en);box-shadow:0 4px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:#CFF5E3}
.opt.no{background:#FFD9D9;animation:shake .35s}
.opt[disabled]{cursor:default}
.word{display:flex;flex-wrap:nowrap;justify-content:center;align-items:flex-end;gap:2px;margin:10px 0 4px;font-family:var(--en);font-size:42px;white-space:nowrap;overflow:hidden}
.word .c{font-size:1em;font-weight:900;letter-spacing:1px}
.word .slot{min-width:1.1em;padding:0 .12em;border-bottom:5px solid #C9CDE0;font-size:1em;font-weight:900;text-align:center;color:var(--green);min-height:1.3em}
.word .slot.act{border-color:var(--pink);animation:blink 1s infinite}
.word .slot.done{border-color:var(--green);animation:pop .3s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.built{min-height:88px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;font-size:clamp(18px,5vw,22px);font-weight:700}
.built span{background:#DDE8FF;border:2.5px solid var(--ink);border-radius:12px;padding:4px 10px;animation:pop .25s}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chunk{min-height:52px;padding:0 14px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:clamp(17px,4.8vw,21px);font-weight:800;font-family:var(--en);box-shadow:0 4px 0 var(--ink)}
.chunk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chunk.used{visibility:hidden}
.chunk.no{animation:shake .35s;background:#FFD9D9}
.chunk.hint{background:#FFE9A6}
#foot{display:flex;gap:8px;align-items:center;padding-top:6px}
#fbtns{display:flex;gap:8px}
.sq{min-width:54px;min-height:54px;border-radius:16px;background:#fff;border:3px solid var(--ink);font-size:22px;box-shadow:0 4px 0 var(--ink)}
.sq.txt{font-size:16px;font-weight:900;padding:0 12px}
.sq:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#next{flex:1;visibility:hidden;background:var(--green);color:#fff}
#next.on{visibility:visible}
.plus{position:fixed;font-weight:900;font-size:22px;color:#E59500;pointer-events:none;animation:rise 1s ease-out forwards;z-index:30;text-shadow:0 2px 0 #fff}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.bp{position:absolute;left:50%;top:38%;font-size:26px;animation:bp 1s ease-out forwards}

/* RESULT / REPORT */
#result,#report{gap:12px;overflow-y:auto;overflow-x:hidden;padding:2px 6px 6px}
#result>*,#report>*,#home>*{flex-shrink:0}
.rtop{display:flex;align-items:center;gap:10px;justify-content:center}
.rtop h2{margin:0;font-size:26px}
.stars{font-size:40px;letter-spacing:4px;text-align:center}
.tmsg{background:#FFF3B8;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:800;text-align:center}
.rcard{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.rcard h3{margin:0;background:var(--ink);color:#fff;padding:8px 14px;font-size:17px}
.rcard .rows{padding:8px 14px 12px}
.rr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:2px dashed #E2E4EE;font-size:16px}
.rr:last-child{border-bottom:0}
.rr span{color:var(--sub)}
.rr b{text-align:right}
.sec-t{font-weight:900;font-size:15px;color:#3F6FE0;margin-top:6px}
.code{font-family:var(--en);letter-spacing:2px}
.weak{font-size:15px;text-align:left;margin-top:6px;color:var(--ink)}
.weak .en{font-family:var(--en);font-weight:800}

/* DEX */
#dex{gap:8px}
.dtop{display:flex;align-items:center;gap:8px}
.dtop h2{flex:1;margin:0;font-size:20px}
#dgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 2px 10px;align-content:start}
.dc{position:relative;display:flex;flex-direction:column;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:6px 4px 8px;min-height:128px;transition:transform .08s}
.dc:active{transform:translateY(3px)}
.dc .no{align-self:flex-start;font-size:13px;font-weight:900;color:var(--sub);padding-left:4px}
.dc .ic{width:64px;height:64px;margin:2px 0}
.dc .ic svg,.mic svg{width:100%;height:100%}
.dc.lock .ic{filter:brightness(0) opacity(.78)}
.dc.lock{background:#EDEFF8}
.dc .q{position:absolute;top:36px;left:0;right:0;text-align:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink);pointer-events:none}
.dc b{font-size:15px;line-height:1.15;text-align:center;font-family:var(--en)}
.dc small{font-size:14px;color:var(--sub);line-height:1.2}
.dc.open{background:#FFFBE3}
.dc.shake{animation:shake .35s}
#modal{position:fixed;inset:0;background:rgba(43,43,58,.55);display:none;z-index:50;align-items:flex-end}
#modal.on{display:flex}
#mbody{width:100%;max-width:480px;margin:0 auto;background:#fff;border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));position:relative;text-align:center;animation:slideup .25s}
#mbody .x{position:absolute;right:12px;top:10px;min-width:44px;min-height:44px;border-radius:14px;background:#fff;border:3px solid var(--ink);font-weight:900}
.mic{position:relative;width:150px;height:150px;margin:6px auto;transition:filter .9s,transform .5s}
.mic.sil{filter:brightness(0) opacity(.8)}
.mic.pop{animation:pop .6s}
.mq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:#fff;text-shadow:0 3px 0 var(--ink);pointer-events:none;transition:opacity .4s}
#minfo h3{margin:4px 0;font-size:28px;font-family:var(--en)}
#minfo .zz{font-size:22px;font-weight:900}
#minfo p{margin:6px 0;font-size:16px;color:var(--sub)}
#minfo p.en{font-family:var(--en);color:var(--ink);font-weight:700;font-size:17px}
#mact{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes blink{50%{border-color:#FFD0DE}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}100%{transform:translateY(0)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes rise{to{opacity:0;transform:translateY(-40px)}}
@keyframes bp{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@keyframes slideup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="app">

  <section id="reg" class="screen">
    <div class="mas idle" id="regmas"></div>
    <h1>單字句子大冒險<br><small style="font-size:16px;font-weight:700;color:var(--sub)">Lesson 3 + 4</small></h1>
    <label class="field">班級<input id="fCls" autocomplete="off" placeholder="例:輪機一A"></label>
    <div class="row2">
      <label class="field">座號<input id="fSeat" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例:12"></label>
      <label class="field">姓名或綽號<input id="fName" autocomplete="off" placeholder="例:小明"></label>
    </div>
    <div id="regerr"></div>
    <button class="btn go" id="regGo">開始冒險 ▶</button>
  </section>

  <section id="home" class="screen"></section>

  <section id="game" class="screen">
    <div id="hud">
      <button id="quit" aria-label="離開">✕</button>
      <span id="lvname"></span>
      <span class="pill">⏱ <span id="tm">0:00</span></span>
      <span class="pill" id="coinPill">🪙 <span id="gc">0</span></span>
    </div>
    <div id="pips"></div>
    <div id="mrow"><div class="mas idle" id="mas"></div><div id="bubble"></div></div>
    <div id="stage"></div>
    <div id="foot"><div id="fbtns"></div><button class="btn" id="next">下一題 →</button></div>
  </section>

  <section id="result" class="screen"></section>

  <section id="dex" class="screen">
    <div class="dtop"><button class="sq" id="dback" aria-label="返回">←</button><h2>電子零件圖鑑 <span id="dcount"></span></h2><span class="badge">🪙 <span id="dcoin">0</span></span></div>
    <div class="tmsg" style="font-size:15px;padding:6px 10px" id="dhint"></div>
    <div id="dgrid"></div>
  </section>

  <section id="report" class="screen"></section>
</div>
<div id="modal"><div id="mbody"></div></div>

<script>
/* ========================================================================
   資料區(換月考範圍只改這裡)
   欄位:[課, 類型(w單字/p片語), 中文, 語塊(用|分成4~5塊), 句子中文, 答案, [干擾選項x2]]
   ※ B1L3 片語 try one's best 的原例句含宗教用語,已換成中性例句。
   ======================================================================== */
const UNLOCK_COST=8;   // 解開一個零件需要的金幣
const DATA=[
/* ---- L3 單字 ---- */
[3,"w","康復(動)","By taking a few days off,|Sally was able to|recover|quickly|from the flu.","藉由休息了幾天，Sally從流感中迅速康復。","recover",["discover","remove"]],
[3,"w","康復(名)","Lisa's|quick recovery|from the break-up|surprised|everyone.","Lisa在分手後迅速恢復讓大家非常驚訝。","recovery",["recover","discovery"]],
[3,"w","外科手術","Mike is getting|surgery|right now|because of|a serious accident.","因為嚴重意外事故，Mike目前正在接受手術。","surgery",["suffer","disease"]],
[3,"w","遭受；受苦","Ray suffered|from back pain before,|but the pain went away|after he started|doing gentle exercise.","Ray以前受背痛所苦，但是在他開始做和緩運動後，背痛就消失了。","suffered",["recovered","realized"]],
[3,"w","疾病","COVID-19 was|a terrible disease|when it|first appeared|in 2019.","2019年新冠肺炎首次出現時，是一種可怕的疾病。","disease",["surgery","design"]],
[3,"w","察覺；意識到","Lily realized|that her son|was a great writer|after she|read his story.","Lily讀了兒子的故事後，才察覺他是個很棒的作家。","realized",["recovered","replied"]],
[3,"w","描述","The boy couldn't find the words|to describe|his dream car,|so he drew|a picture of it.","男孩找不到文字來描述他夢想中的汽車，所以他把它畫出來。","describe",["design","imagine"]],
[3,"w","情侶；夫妻","The newly married couple|planned to go|on a trip|to Iceland|for their honeymoon.","這對新婚夫妻計劃要去冰島度蜜月。","couple",["view","nurse"]],
[3,"w","鼓勵","Mike's parents|always encourage him|to work hard|and follow|his dreams.","Mike的父母一直鼓勵他努力工作與追求夢想。","encourage",["imagine","describe"]],
[3,"w","景觀","Hotel rooms|with a good view|of the sea|are usually|more expensive.","能看到美麗海景的旅館房間通常比較貴。","view",["design","position"]],
[3,"w","看待","Most people in Taiwan|view|the LINE smartphone app|as a must-have.","臺灣大部分的人將LINE智慧型手機應用程式視為必備的東西。","view",["realize","return"]],
[3,"w","想像","Our music teacher|asked us|to close our eyes|and imagine|that we were at a beach.","我們的音樂老師要我們閉上眼睛，想像我們正在海灘上。","imagine",["describe","encourage"]],
[3,"w","想像力","Leo's poem shows|that he is a kid|with a great|imagination.","Leo的詩顯示他是個擁有無窮想像力的孩子。","imagination",["imagine","invention"]],
[3,"w","移除","Do you know|any good ways|to remove|the price sticker|from this box?","你知道有什麼好方法可以將價格標籤從這個盒子上移除嗎？","remove",["recover","return"]],
[3,"w","回答；回覆(動)","Henry replied|right after|he got|my message.","Henry一收到我的訊息後就回覆了。","replied",["returned","realized"]],
[3,"w","回覆(名)","Max sent an email|to Helen,|but he didn't get|a reply.","Max寄給Helen一封電子郵件，但他沒有收到回覆。","reply",["return","research"]],
[3,"w","返回","After a one-year trip,|Tom finally|returned|to his hometown.","一年的旅行後，Tom終於回到了他的家鄉。","returned",["removed","replied"]],
[3,"w","歸還","Jenny returned|Ken's book to him|after she|finished reading it.","Jenny讀完Ken的書後，就把它歸還給Ken了。","returned",["removed","described"]],
[3,"w","震驚的","Flora was shocked|and upset|when she|heard the news.","當Flora聽到那個消息時，她既震驚又沮喪。","shocked",["blind","regular"]],

function speak(text,rate,cb){
  let fired=false;const f=()=>{if(!fired){fired=true;if(cb)cb();}};
  if(!("speechSynthesis" in window)){setTimeout(f,1000);return;}
  try{
    speechSynthesis.cancel();

    u.onend=f;u.onerror=f;

}

function tone(f,d,delay,type,v){

    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(v||0.13,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- 第 1 關:單字聽寫(補母音/雙母音) ---------- */
const VOWELS=["a","e","i","o","u"];
const DIGRAPHS=["ai","ay","ea","ee","ie","ei","oa","oo","ou","ow","io","ue","au"];
function parseWord(w){
  const parts=[],re=/[aeiou]+/gi;let last=0,m;
  while((m=re.exec(w))){if(m.index>last)parts.push({c:w.slice(last,m.index)});parts.push({v:m[0]});last=m.index+m[0].length;}
  if(last<w.length)parts.push({c:w.slice(last)});
  return parts;
}
// 單母音:從 a e i o u 選 4 個(含答案);雙母音:4 個選項全是雙母音
function slotOptions(v){
  if(v.length===1)return shuffle([v].concat(shuffle(VOWELS.filter(x=>x!==v)).slice(0,3)));
  const others=DIGRAPHS.filter(x=>x!==v);
  const share=others.filter(x=>[...x].some(ch=>v.indexOf(ch)>=0));
  const rest=others.filter(x=>share.indexOf(x)<0);
  const pick=shuffle(share).slice(0,3);
  pick.push(...shuffle(rest).slice(0,3-pick.length));
  return shuffle([v].concat(pick));
}
function renderL1(it,tok){
  const mode=zhMode(it,1);let zhUsed=false,zhOn=mode==="show";
  const parts=parseWord(it.ans.toLowerCase());
  const slots=parts.map((p,i)=>p.v?i:-1).filter(i=>i>=0);
  let cur=0,mistakes=0,slotMiss=0,assist=false,finished=false;
  stage('<div class="card"><div class="tag">🎧 聽一聽，補上母音</div><div class="word" id="word"></div>'+
    '<div class="sent" lang="en" style="font-size:clamp(16px,4.6vw,20px);color:var(--sub)">'+esc(it.pre)+"____"+esc(it.post)+'</div>'+
    '<div class="zh" id="zh" lang="zh-Hant"></div></div>'+
    '<div class="tiles" id="tiles"></div>');
  const showZh=()=>{zhOn=true;$("#zh").innerHTML="<b>"+esc(it.zw)+"</b>　"+esc(it.zs);};
  if(zhOn)showZh();
  const wd=$("#word"),tiles=$("#tiles");
  const paint=()=>{
    wd.innerHTML="";
    parts.forEach((p,i)=>{
      const s=document.createElement("span");
      if(p.c){s.className="c";s.textContent=p.c;}
      else{const k=slots.indexOf(i);s.className="slot"+(k<cur?" done":k===cur?" act":"");s.textContent=k<cur?p.v:"";}
      wd.appendChild(s);
    });
    let fs=42;wd.style.fontSize=fs+'px';
    while(fs>16&&wd.scrollWidth>wd.clientWidth){fs-=1;wd.style.fontSize=fs+'px';}
  };
  const load=()=>{
    tiles.innerHTML="";if(cur>=slots.length)return;
    const want=parts[slots[cur]].v;slotMiss=0;
    slotOptions(want).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;b.lang="en";
      b.onclick=()=>{
        if(finished)return;
        if(o===want){
          sfx.tick();cur++;paint();
          if(cur>=slots.length){
            finished=true;tiles.innerHTML="";showZh();
            const ok=mistakes<=1;
            finishQ(ok,mistakes===0&&!assist&&!zhUsed);
            if(ok){speak(it.ans,.8);advance(tok,1700);}
            else{showNext(tok);speak(it.ans,.7,()=>{if(sid===tok)speak(it.text,.9);});}
          }else load();
        }else{
          mistakes++;slotMiss++;b.classList.add("no");b.disabled=true;sfx.no();
          if(slotMiss>=2){assist=true;[...tiles.children].forEach(x=>{if(x.textContent===want)x.classList.add("ok");});}
        }
      };
      tiles.appendChild(b);
    });
  };
  paint();load();
  speak(it.ans,.75,()=>{if(sid===tok)speak(it.text,.9);});
  const foot=[{t:"🔊",fn:()=>speak(it.ans,.85)},{t:"🐢",fn:()=>speak(it.ans,.55)},{t:"📖",fn:()=>speak(it.text,.9)}];
  if(mode==="btn")foot.push(zhBtn(()=>{zhUsed=true;showZh();}));
  setFoot(foot);
}

/* ---------- 第 2 關:句子重組(4~5 個語塊) ---------- */
function renderL2(it,tok){
  const mode=zhMode(it,2);let zhUsed=false,zhOn=mode==="show";
  const ch=it.chunks;let step=0,mistakes=0,stepMiss=0,assist=false,finished=false;
  let order=shuffle(ch.map((c,i)=>i));
  for(let t=0;t<6&&order.every((o,i)=>o===i);t++)order=shuffle(order);
  stage('<div class="card"><div class="tag">🧩 按順序點出句子</div><div class="built" id="built" lang="en"></div><div class="zh" id="zh" lang="zh-Hant"></div></div><div class="bank" id="bank"></div>');
  const showZh=()=>{zhOn=true;$("#zh").innerHTML=esc(it.zs);};
  if(zhOn)showZh();
  const bank=$("#bank"),built=$("#built");
  order.forEach(oi=>{
    const b=document.createElement("button");b.className="chunk";b.textContent=ch[oi];b.lang="en";
    b.onclick=()=>{
      if(finished||b.classList.contains("used"))return;
      if(ch[oi]===ch[step]){
        sfx.tick();b.classList.add("used");
        const s=document.createElement("span");s.textContent=ch[oi];built.appendChild(s);
        step++;stepMiss=0;[...bank.children].forEach(x=>x.classList.remove("hint"));
        if(step>=ch.length){
          finished=true;showZh();
          const ok=mistakes<=2;
          finishQ(ok,mistakes===0&&!assist&&!zhUsed);
          if(ok){showNext(tok);speak(it.text,.9,()=>{if(sid===tok)advance(tok,350);});}
          else{showNext(tok);speak(it.text,.9);}
        }
      }else{
        mistakes++;stepMiss++;b.classList.remove("no");void b.offsetWidth;b.classList.add("no");sfx.no();
        if(stepMiss>=2){assist=true;[...bank.children].forEach(x=>{if(!x.classList.contains("used")&&x.textContent===ch[step])x.classList.add("hint");});}
      }
    };
    bank.appendChild(b);
  });
  if((P.pts[it.id]||0)<4)speak(it.text,.9);
  const foot=[{t:"🔊",fn:()=>speak(it.text,.9)},{t:"🐢",fn:()=>speak(it.text,.6)}];
  if(mode==="btn")foot.push(zhBtn(()=>{zhUsed=true;showZh();}));
  setFoot(foot);
}

/* ---------- 第 3 關:例句選擇(直接朗讀整句,答案不遮) ---------- */
function renderL3(it,tok){
  let zhUsed=false,done=false;
  const opts=shuffle([it.ans].concat(shuffle(it.d).slice(0,2)));
  stage('<div class="card"><div class="tag">🎯 聽一聽，選出正確的字</div><div class="sent" lang="en">'+esc(it.pre)+'<span class="blank" id="bl">&nbsp;</span>'+esc(it.post)+'</div><div class="zh" id="zh" lang="zh-Hant"></div></div><div class="opts" id="opts"></div>');
  const showZh=()=>{$("#zh").innerHTML="<b>"+esc(it.zw)+"</b>　"+esc(it.zs);};
  const box=$("#opts");
  opts.forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;b.lang="en";
    b.onclick=()=>{
      if(done)return;done=true;
      [...box.children].forEach(x=>{x.disabled=true;if(x.textContent===it.ans)x.classList.add("ok");});
      const bl=$("#bl");bl.textContent=it.ans;bl.classList.add("fill");
      if(o===it.ans){finishQ(true,!zhUsed);advance(tok,1300);}
      else{b.classList.add("no");showZh();finishQ(false,false);showNext(tok);speak(it.text,.9);}
    };
    box.appendChild(b);
  });
  speak(it.text,.9);
  setFoot([{t:"🔊",fn:()=>speak(it.text,.9)},{t:"🐢",fn:()=>speak(it.text,.6)},zhBtn(()=>{zhUsed=true;showZh();})]);
}

/* ---------- 一關結束 / 成績卡 ---------- */
function timeMsg(run){
  const act=fmtDur(run.ms);
  if(run.guess){
    const diff=run.guess*60000-run.ms;
    if(diff>0)return "你猜 "+run.guess+" 分鐘，只花了 "+act+"，比想像的少 "+fmtDur(diff)+"！";
    return "你猜 "+run.guess+" 分鐘，實際用了 "+act+"。每一分鐘的專心都有收穫！";
  }
  return "這一關只花了 "+act+"，比想像中更快完成！";
}
function cardHTML(run){
  const today=dstr(),tr=P.runs.filter(r=>r.d===today);
  const tOk=tr.reduce((a,r)=>a+r.ok,0),tN=tr.reduce((a,r)=>a+r.n,0),tMs=tr.reduce((a,r)=>a+r.ms,0);
  const stamp=run?run.t:Date.now();
  const code=mkCode([P.cls,P.seat,P.name,dstr(stamp),P.earned,P.ok,Math.round(P.totalMs/1000)].join("|"));
  const row=(a,b)=>'<div class="rr"><span>'+a+'</span><b>'+b+'</b></div>';
  return '<div class="rcard"><h3>📋 練習紀錄卡</h3><div class="rows">'+
    row("班級",esc(P.cls))+row("座號",esc(P.seat))+row("姓名",esc(P.name))+row("時間",tstr(stamp))+
    (run?'<div class="sec-t">這一關</div>'+row(LV[run.lvl].name,run.ok+" / "+run.n+" 題")+row("用時",fmtDur(run.ms))+row("本關金幣","🪙 +"+run.coins):'')+
    '<div class="sec-t">今天</div>'+row("練習次數",tr.length+" 次")+row("答對",tOk+" / "+tN+" 題")+row("練習時間",fmtDur(tMs))+
    '<div class="sec-t">累計</div>'+row("總練習時間",fmtDur(P.totalMs))+row("金幣","🪙 "+P.coins)+row("圖鑑","📖 "+P.unlocked.length+" / "+COMPS.length)+
    row("驗證碼",'<span class="code">'+code+'</span>')+'</div></div>';
}
function endLevel(){
  G.running=false;sfx.fin();try{speechSynthesis.cancel();}catch(e){}
  const n=G.ok,stars=n>=9?3:n>=7?2:1;
  const run={t:Date.now(),d:dstr(),lvl:G.lvl,ok:n,n:10,ms:G.ms,coins:G.coins,guess:G.guess};
  P.runs.push(run);if(P.runs.length>120)P.runs.shift();
  P.best[G.lvl]=Math.max(P.best[G.lvl]||0,stars);saveDb();
  burst(["🎉","⭐","✨","🪙","🎊"],26);
  const lv=G.lvl,canOpen=P.coins>=UNLOCK_COST;
  const msg=n>=9?"太強了！這關幾乎全對！":n>=7?"很棒！再練一次就更穩了！":n>=4?"有進步！錯的地方就是你變強的機會。":"勇敢練習就是成功的第一步，再試一次吧！";
  const weak=G.wrong.slice(0,3).map(w=>'<div><span class="en" lang="en">'+(lv===1?esc(w.ans):esc(w.pre)+'<u>'+esc(w.ans)+'</u>'+esc(w.post))+'</span> <span lang="zh-Hant" style="color:var(--sub)">'+esc(w.zw)+'</span></div>').join("");
  $("#result").innerHTML=
    '<div class="rtop"><div class="mas happy" id="rmas"></div><h2>第 '+lv+' 關完成！</h2></div>'+
    '<div class="stars">'+starsOf(stars)+'</div>'+
    '<div class="tmsg">'+esc(msg)+'<br>'+esc(timeMsg(run))+'</div>'+
    cardHTML(run)+
    (weak?'<div class="card weak"><b>下次先看看這幾個：</b>'+weak+'</div>':'')+
    '<div style="text-align:center;font-size:15px;color:var(--sub)">📸 可以截圖上面的紀錄卡給老師</div>'+
    (canOpen?'<button class="btn pulse" id="rDex">🔓 你有 '+P.coins+' 枚金幣，去解鎖零件！</button>':'')+
    (lv<3?'<button class="btn go" id="rNext">下一關：第 '+(lv+1)+' 關 →</button>':'<button class="btn go" id="rNext">🎉 三關全部完成！回首頁</button>')+
    '<button class="btn sec" id="rAgain">再玩一次這一關</button>'+
    '<button class="link" id="rHome">回首頁</button>';
  setMas($("#rmas"),"happy");
  if($("#rDex"))$("#rDex").onclick=openDex;
  $("#rNext").onclick=()=>{if(lv<3)startLevel(lv+1);else{renderHome();show("home");}};
  $("#rAgain").onclick=()=>startLevel(lv);
  $("#rHome").onclick=()=>{renderHome();show("home");};
  show("result");$("#result").scrollTop=0;
}
function renderReport(){
  $("#report").innerHTML='<div class="rtop"><h2>📋 我的成績單</h2></div>'+cardHTML(null)+
   '<div style="text-align:center;font-size:15px;color:var(--sub)">📸 截圖這個畫面給老師。驗證碼只是提醒，請誠實練習喔！</div>'+
   '<button class="btn sec" id="repBack">← 回首頁</button>';
  $("#repBack").onclick=()=>{renderHome();show("home");};
}

/* ---------- 電子零件圖鑑 ---------- */
function openDex(){renderDex();show("dex");}
$("#dback").onclick=()=>{$("#modal").classList.remove("on");renderHome();show("home");};
function renderDex(){
  $("#dcount").textContent=P.unlocked.length+"/"+COMPS.length;
  $("#dcoin").textContent=P.coins;
  $("#dhint").textContent="答對一題 +1 🪙，解開一個零件要 "+UNLOCK_COST+" 🪙。點一下神祕零件試試看！";
  $("#dgrid").innerHTML=COMPS.map((c,i)=>{
    const open=P.unlocked.indexOf(c.id)>=0;
    return '<button class="dc '+(open?'open':'lock')+'" data-i="'+i+'"><span class="no">#'+pad(i+1)+'</span><div class="ic">'+c.svg+'</div>'+
      (open?'<b lang="en">'+esc(c.en)+'</b><small lang="zh-Hant">'+esc(c.zh)+'</small>':'<b>? ? ?</b><small>&nbsp;</small><span class="q">?</span>')+'</button>';
  }).join("");
  $("#dgrid").querySelectorAll(".dc").forEach(b=>b.onclick=()=>openComp(+b.dataset.i,b));
}
let modalTok=0;
function closeModal(){modalTok++;$("#modal").classList.remove("on");try{speechSynthesis.cancel();}catch(e){}}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal();};
function openComp(i,btn){
  const c=COMPS[i],open=P.unlocked.indexOf(c.id)>=0;
  if(!open&&P.coins<UNLOCK_COST){
    sfx.no();if(btn){btn.classList.remove("shake");void btn.offsetWidth;btn.classList.add("shake");}
    $("#dhint").textContent="還差 "+(UNLOCK_COST-P.coins)+" 枚金幣就能解開，繼續加油！💪";
    return;
  }
  modalTok++;const body=$("#mbody");
  body.innerHTML='<button class="x" id="mx" aria-label="關閉">✕</button><div class="mic '+(open?'':'sil')+'" id="mic">'+c.svg+(open?'':'<div class="mq" id="mq">?</div>')+'</div><div id="minfo"></div><div id="mact"></div>';
  $("#mx").onclick=closeModal;
  const info=$("#minfo"),act=$("#mact");
  const paintOpen=()=>{
    info.innerHTML='<h3>'+esc(c.en)+'</h3><div class="zz" lang="zh-Hant">'+esc(c.zh)+'</div><p class="en" lang="en">'+esc(c.de)+'</p><p lang="zh-Hant">'+esc(c.dz)+'</p>';
    act.innerHTML='<button class="btn" id="mSay">🔊 聽發音</button>';
    const sb=act.querySelector("#mSay");if(sb)sb.onclick=()=>speak(c.en+". "+c.de,.85);
  };
  $("#modal").classList.add("on");
  if(open){paintOpen();return;}
  info.innerHTML='<h3>? ? ?</h3><p lang="zh-Hant">神祕零件 #'+pad(i+1)+'<br>用 '+UNLOCK_COST+' 枚金幣解開它！</p>';
  act.innerHTML='<button class="btn go" id="mGo">🪙 '+UNLOCK_COST+'　解開！</button><button class="btn sec" id="mNo">再想想</button>';
  $("#mNo").onclick=closeModal;
  $("#mGo").onclick=()=>{
    if(P.coins<UNLOCK_COST)return;
    P.coins-=UNLOCK_COST;P.unlocked.push(c.id);saveDb();
    sfx.unlock();burst(["✨","⭐","🎉","🪙","🔓"],28);
    const mic=$("#mic");mic.classList.remove("sil");mic.classList.add("pop");const q=$("#mq");if(q)q.style.opacity=0;
    const mt=++modalTok;
    setTimeout(()=>{if(mt!==modalTok||!$("#modal").classList.contains("on"))return;paintOpen();speak(c.en,.8,()=>{if(mt===modalTok)speak(c.de,.85);});},500);
    renderDex();
  };
}

/* ---------- 啟動 ---------- */
if(db.last&&db.profiles[db.last]){P=db.profiles[db.last];renderHome();show("home");}
else show("reg");
window.__t={ITEMS:ITEMS,WORDS:WORDS,COMPS:COMPS,G:()=>G,P:()=>P,UNLOCK_COST:UNLOCK_COST};
})();
</script>
